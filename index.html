<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetra Master</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #12151c;
        --edge: #2a3040;
        --ink: #e6e9f0;
        --muted: #8b93a7;
        --player: #5b8dd6;
        --ai: #d68a5b;
        --accent: #7aa2f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1rem;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      canvas {
        display: block;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgb(0 0 0 / 55%);
        touch-action: none;
      }
      .status {
        min-height: 1.4em;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .hand {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .hand-card,
      .picker-option,
      .claim-card,
      .rematch {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.5rem 0.7rem;
        min-width: 7.5rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .hand-card:hover,
      .picker-option:hover,
      .claim-card:hover,
      .rematch:hover {
        border-color: var(--accent);
      }
      .hand-card:focus-visible,
      .picker-option:focus-visible,
      .claim-card:focus-visible,
      .rematch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hand-card.is-selected {
        border-color: var(--accent);
        background: #1a2334;
      }
      .hand-name {
        font-weight: 600;
      }
      .hand-code,
      .picker-codes {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hand-arrows {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .hand-arrows.is-dead,
      .hand-warning {
        color: #e88b8b;
        font-size: 0.75rem;
      }
      .picker {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.75rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        max-width: 40rem;
      }
      .picker-heading,
      .result-heading {
        margin: 0;
        font-size: 0.95rem;
      }
      .picker-list,
      .claim-list {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .picker-odds {
        color: var(--accent);
        font-size: 0.85rem;
      }
      .picker-arrows {
        color: var(--muted);
        font-size: 0.75rem;
      }
      .result-body,
      .result-taken {
        margin: 0.25rem 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .hint {
        min-height: 1.4em;
        color: var(--accent);
        font-size: 0.85rem;
        max-width: 40rem;
        text-align: center;
      }
      .keys {
        color: #5a6274;
        font-size: 0.75rem;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Tetra Master</h1>
    <canvas id="board" width="560" height="560" aria-label="Game board"></canvas>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="hand" id="hand" role="group" aria-label="Your hand"></div>
    <div class="picker" id="picker" hidden></div>
    <div class="picker" id="results" hidden role="group" aria-label="Match result"></div>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <p class="keys" id="keys"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
