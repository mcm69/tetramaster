<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetra Master</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #12151c;
        --edge: #2a3040;
        --ink: #e6e9f0;
        --muted: #8b93a7;
        --player: #5b8dd6;
        --ai: #d68a5b;
        --accent: #7aa2f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1rem;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      canvas {
        display: block;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgb(0 0 0 / 55%);
        touch-action: none;
      }
      .status {
        min-height: 1.4em;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .hand {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .hand-card,
      .picker-option,
      .claim-card,
      .rematch {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.5rem 0.7rem;
        min-width: 7.5rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .hand-card:hover,
      .picker-option:hover,
      .claim-card:hover,
      .rematch:hover {
        border-color: var(--accent);
      }
      .hand-card:focus-visible,
      .picker-option:focus-visible,
      .claim-card:focus-visible,
      .rematch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hand-card.is-selected {
        border-color: var(--accent);
        background: #1a2334;
      }
      .hand-name {
        font-weight: 600;
      }
      .hand-code,
      .picker-codes {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hand-arrows {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .hand-arrows.is-dead,
      .hand-warning {
        color: #e88b8b;
        font-size: 0.75rem;
      }
      .picker {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.75rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        max-width: 40rem;
      }
      .picker-heading,
      .result-heading {
        margin: 0;
        font-size: 0.95rem;
      }
      .picker-list,
      .claim-list {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .picker-odds {
        color: var(--accent);
        font-size: 0.85rem;
      }
      .picker-arrows {
        color: var(--muted);
        font-size: 0.75rem;
      }
      .result-body,
      .result-taken {
        margin: 0.25rem 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .hint {
        min-height: 1.4em;
        color: var(--accent);
        font-size: 0.85rem;
        max-width: 40rem;
        text-align: center;
      }
      .keys {
        color: #5a6274;
        font-size: 0.75rem;
        text-align: center;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .collection-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(64rem, 96vw);
        padding: 1rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
      }
      .collector-level {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--accent);
      }
      /* §1.9: the original superimposes this once the catalogue is complete. Reproduced, not fixed. */
      .collector-level.is-glitch {
        color: #e8b04b;
        letter-spacing: 0.08em;
      }
      .collector-points,
      .collector-progress,
      .deck-heading,
      .deck-name,
      .deck-code,
      .deck-empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .deck-name {
        color: var(--ink);
        font-weight: 600;
      }
      .collection-controls,
      .deck-actions,
      .deck-slots {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .collection-filter {
        display: flex;
        gap: 0.3rem;
        align-items: center;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .collection-search,
      .collection-filter select {
        padding: 0.25rem 0.4rem;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
      }
      .collection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: 0.5rem;
        max-height: 45vh;
        overflow-y: auto;
      }
      .collection-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.5rem 0.7rem;
        background: #161a24;
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .collection-card:hover {
        border-color: var(--accent);
      }
      .collection-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .collection-card.is-decked {
        border-color: var(--accent);
        background: #1a2334;
      }
      .collection-name {
        font-weight: 600;
        padding-right: 2.5rem;
      }
      .collection-code,
      .collection-meta {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .collection-points-badge {
        position: absolute;
        top: 0.5rem;
        right: 0.6rem;
        color: var(--accent);
        font-weight: 600;
        font-size: 0.85rem;
      }
      .collection-points-badge.is-zero {
        color: #5a6274;
      }
      .collection-empty {
        color: var(--muted);
        text-align: center;
      }
      .deck-slots {
        align-items: stretch;
      }
      .deck-slot {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        flex: 1 1 12rem;
        padding: 0.5rem 0.7rem;
        background: #161a24;
        border: 1px solid var(--edge);
        border-radius: 8px;
      }
      .deck-clear {
        align-self: flex-start;
        padding: 0.2rem 0.5rem;
        background: none;
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--muted);
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .deck-clear:hover {
        border-color: var(--accent);
        color: var(--ink);
      }
      .deck-warning {
        margin: 0;
        color: #e88b8b;
        font-size: 0.75rem;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Tetra Master</h1>
    <div class="collection-panel" id="collection" hidden aria-label="Collection and deck"></div>
    <canvas id="board" width="560" height="560" aria-label="Game board"></canvas>
    <div class="toolbar">
      <button type="button" class="rematch" id="toggle-collection">Collection (C)</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="hand" id="hand" role="group" aria-label="Your hand"></div>
    <div class="picker" id="picker" hidden></div>
    <div class="picker" id="results" hidden role="group" aria-label="Match result"></div>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <p class="keys" id="keys"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
