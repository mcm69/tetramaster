<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tetra Master</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #12151c;
        --edge: #2a3040;
        --ink: #e6e9f0;
        --muted: #8b93a7;
        --player: #5b8dd6;
        --ai: #d68a5b;
        --accent: #7aa2f7;
      }
      * {
        box-sizing: border-box;
      }
      html {
        /* The viewport itself never scrolls. `body` is the one scroller, so there is exactly one
           place a measurement can look and exactly one thing a finger can drag. */
        overflow: hidden;
      }
      body {
        margin: 0;
        /* 100vh is the *large* viewport: on a phone it runs under a URL bar that then collapses
           over the content. `dvh` is what is actually on screen. Declared second so the fallback
           wins where it is unsupported. */
        /* Constrained, not `min-height`. A minimum lets the body grow to its content, and then the
           board slot has no overflow to distribute and the board never shrinks — which is what
           actually happened the first time round. `overflow-y: auto` is the safety valve for the
           case where even this is not enough: the collection screen, or a text size that makes the
           controls genuinely taller than a phone. */
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
        overflow-x: clip;
        /* `safe centre` rather than `centre`: with plain centring, content taller than the body is
           laid out starting *above* the top edge, where no amount of scrolling can reach it. The
           board measured at y = -41px on a 1280x720 window. `safe` falls back to `start` in exactly
           that case and centres otherwise. */
        justify-content: safe center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        /* A notch on the left or right, and a home indicator at the bottom, both sit *inside* the
           viewport once `viewport-fit=cover` is set, so the padding has to make room for them. */
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      /* The board's size belongs to CSS, not to JavaScript. `main.ts` reads the result and works
         out the backing store and the transform; it does not decide how big the board is.
         No `width` or `height` here on purpose: with both left `auto`, `max-width` clamps the
         element's intrinsic size and the square survives. Setting either dimension would let a second
         constraint clamp independently and the board would go rectangular.

         There is deliberately **no `max-height`**. It looks like the obvious way to stop the board
         running off a short screen, and it silently does nothing: the percentage does not resolve
         against a grid area whose height came from flexing, the canvas keeps its width-derived size,
         and it paints across the toolbar. The board's size is its width's business. */
      canvas {
        display: block;
        width: auto;
        height: auto;
        max-width: min(100%, 560px);
        aspect-ratio: 1 / 1;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgb(0 0 0 / 55%);
        touch-action: none;
      }
      /* A wrapper so the board can be positioned and, later, placed beside the hand tray in
         landscape. It deliberately does *not* grow or shrink.

         It used to be `flex: 1 1 auto; min-height: 0`, on the reasoning that the board should take
         whatever space the chrome left. Two things went wrong with that, and the second is the one
         that mattered: the slot shrank to 164px, the canvas ignored it (`max-height: 100%` does not
         clamp against a shrunken grid area), and the board painted straight over the toolbar, the
         status line and the hand tray. Shrinking the board was a bad idea regardless — on a 393x852
         phone the chrome leaves about 164px, which is a 41px square — and the page fitted to within
         a pixel anyway at 361 + 490 = 851 of 852. So: the board is as large as its width allows, and
         the document scrolls when the total genuinely does not fit. */
      .board-slot {
        flex: 0 0 auto;
        width: 100%;
        display: grid;
        place-items: center;
      }
      .status {
        min-height: 1.4em;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .hand-card,
      .picker-option,
      .claim-card,
      .rematch {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.5rem 0.7rem;
        min-width: 7.5rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .hand-card:hover,
      .picker-option:hover,
      .claim-card:hover,
      .rematch:hover {
        border-color: var(--accent);
      }

      /* Touch targets (MOBILE.md stage M5).
         44px is the smallest square a thumb hits reliably. Stage M0 found eight controls under it
         *on every device, desktop included* — the mode buttons at 33.6px, the opponent select at
         27px, both preference toggles at 19.2px, the two bottom buttons at 40.5px — so the floor is
         applied at every width rather than only on phones. A 19px checkbox is not a desktop design
         choice, it is a small target that happens to have a mouse.

         The checkboxes are labelled, and tapping the label toggles them, so the *label* is the target
         and it is the label that gets the height. The bare `<input>` is left at its natural size,
         because padding on a 13px box does nothing for anyone's thumb. */
      .mode-button,
      .menu-trigger,
      .rematch,
      .opponent-select,
      .toolbar-toggle {
        min-height: 44px;
      }
      .toolbar-toggle {
        display: flex;
        align-items: center;
      }
      /* The Settings button becomes a bare glyph below 30rem, and a glyph needs the width as much as
         it needs the height. */
      @media (max-width: 30rem) {
        .menu-trigger {
          min-width: 44px;
        }
      }

      /* Touch hygiene.
         `manipulation` rather than `none` on the board: `none` also forbids pinch-zoom over the
         main play area, which is an accessibility cost for a page a low-vision player may need to
         magnify. `manipulation` still removes the 300ms double-tap delay and still allows panning.
         The hand cards keep `none` below, because M6's drag starts on them and a gesture that
         scrolled the page halfway across the board would be worse than a lost pinch. */
      canvas {
        touch-action: manipulation;
      }
      .hand-card,
      .picker-option,
      .claim-card {
        touch-action: none;
      }
      /* No blue flash on tap, and no text selection from a fast double-tap on a control. Both are
         page-level behaviours that a control should not inherit. */
      button,
      select,
      .toolbar-toggle,
      .hand-card {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Prose is prose: the rules and collection screens are for reading, and a player who wants to
         copy a card name or a rule out of them should be able to. */
      #rules,
      #collection,
      .mode-note,
      .menu-note,
      .hint {
        user-select: text;
        -webkit-user-select: text;
      }
      /* Something to feel instead of the blue flash. */
      .mode-button:active,
      .menu-trigger:active,
      .rematch:active,
      .hand-card:active {
        background: #1a2334;
      }
      .hand-card:focus-visible,
      .picker-option:focus-visible,
      .claim-card:focus-visible,
      .rematch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hand-card.is-selected {
        border-color: var(--accent);
        background: #1a2334;
      }

      /* One row, five equal columns, at every size. Wrapping is what made the tray 236px tall on a
         320px phone and 294px on an iPad; a tray that costs a third of the screen is not a tray.
         The cards share the row rather than scrolling it, so all five stay visible at once —
         scrolling a tray to see which card you are holding is worse than a small one. */
      .hand {
        display: flex;
        gap: 0.5rem;
        flex-wrap: nowrap;
        justify-content: center;
        /* Definite, and not `max-width`: the cards below are size-contained (see
           `container-type`), so they report no content width for this to shrink-to-fit around.
           Left to itself the tray collapsed to 154px and gave each card 24px. */
        width: 100%;
        max-width: min(64rem, 100%);
      }
      .hand-card {
        min-width: 0;
        flex: 1 1 0;
        align-items: center;
        text-align: center;
        /* So the card can ask how wide *it* is, rather than the media query guessing from the
           screen. The two are different questions: an iPad at 768px gives each card 147px, a
           1440px desktop gives 171px, and a 320px phone gives 57px. */
        container-type: inline-size;
      }
      /* The arrow directions are already drawn as a sprite directly above the name, so on a narrow
         card the text version repeats the same information — wrapped over six lines, 75px of a
         236px tray, unreadable at 57px wide. What is lost is the "no arrows at all" warning, which
         the empty sprite already shows. Degrades to showing the text where containers are
         unsupported, which is merely verbose rather than broken. */
      @container (max-width: 130px) {
        .hand-arrows {
          display: none;
        }
      }

      /* The card's arrow pattern, drawn with the same code the board uses. */
      .arrow-preview {
        display: block;
        margin: 0 auto;
        border-radius: 6px;
        border: 1px solid var(--edge);
      }
      .hand-name {
        font-weight: 600;
      }
      .hand-code,
      .picker-codes {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hand-arrows {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .hand-arrows.is-dead,
      .hand-warning {
        color: #e88b8b;
        font-size: 0.75rem;
      }
      .picker {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.75rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        max-width: 40rem;
      }
      .picker-heading,
      .result-heading {
        margin: 0;
        font-size: 0.95rem;
      }
      .picker-list,
      .claim-list {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .picker-odds {
        color: var(--accent);
        font-size: 0.85rem;
      }
      .picker-arrows {
        color: var(--muted);
        font-size: 0.75rem;
      }
      .result-body,
      .result-taken {
        margin: 0.25rem 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      /* An empty hint was costing 19px plus its gap on every screen — which is 27px of a 667px
         phone spent on saying nothing. `:empty` rather than a narrow-screen rule, because it is
         wasted space everywhere, and the hint is genuinely empty most of the time. */
      .hint:empty {
        display: none;
      }
      .hint {
        min-height: 1.4em;
        color: var(--accent);
        font-size: 0.85rem;
        max-width: 40rem;
        text-align: center;
      }
      .keys {
        color: #5a6274;
        font-size: 0.75rem;
        text-align: center;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .collection-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        /* `96vw` rather than `100%` measured the *viewport*, not this element's content box, which
           is 32px narrower because of the body's padding — so both of these were 16px too wide and
           overflowed every phone. The body is the scroller now and clips it, which is how a silent
           16px overflow turned into a hidden one. */
        width: min(64rem, 100%);
        padding: 1rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
      }
      .collector-level {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--accent);
      }
      /* §1.9: the original superimposes this once the catalogue is complete. Reproduced, not fixed. */
      .collector-level.is-glitch {
        color: #e8b04b;
        letter-spacing: 0.08em;
      }
      .collector-points,
      .collector-progress,
      .deck-heading,
      .deck-name,
      .deck-code,
      .deck-empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .deck-name {
        color: var(--ink);
        font-weight: 600;
      }
      .collection-controls,
      .deck-actions,
      .deck-slots {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .collection-filter {
        display: flex;
        gap: 0.3rem;
        align-items: center;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .collection-search,
      .collection-filter select {
        padding: 0.25rem 0.4rem;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
      }
      .collection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: 0.5rem;
        max-height: 45vh;
        overflow-y: auto;
      }
      .collection-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        text-align: center;
        padding: 0.5rem 0.7rem;
        background: #161a24;
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .collection-card:hover {
        border-color: var(--accent);
      }
      .collection-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .collection-card.is-decked {
        border-color: var(--accent);
        background: #1a2334;
      }
      .collection-name {
        font-weight: 600;
        padding-right: 2.5rem;
      }
      .collection-meta {
        font-family: inherit;
      }
      .collection-code,
      .collection-meta {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .collection-points-badge {
        position: absolute;
        top: 0.5rem;
        right: 0.6rem;
        color: var(--accent);
        font-weight: 600;
        font-size: 0.85rem;
      }
      .collection-points-badge.is-zero {
        color: #5a6274;
      }
      .collection-empty {
        color: var(--muted);
        text-align: center;
      }
      .deck-slots {
        align-items: stretch;
      }
      .deck-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        text-align: center;
        flex: 1 1 12rem;
        padding: 0.5rem 0.7rem;
        background: #161a24;
        border: 1px solid var(--edge);
        border-radius: 8px;
      }
      .deck-clear {
        align-self: center;
        padding: 0.2rem 0.5rem;
        background: none;
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--muted);
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .deck-clear:hover {
        border-color: var(--accent);
        color: var(--ink);
      }
      .deck-warning {
        margin: 0;
        color: #e88b8b;
        font-size: 0.75rem;
      }
      .toolbar-bar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        /* `96vw` rather than `100%` measured the *viewport*, not this element's content box, which
           is 32px narrower because of the body's padding — so both of these were 16px too wide and
           overflowed every phone. The body is the scroller now and clips it, which is how a silent
           16px overflow turned into a hidden one. */
        width: min(64rem, 100%);
      }
      .mode-bar {
        display: flex;
        gap: 0.25rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .mode-button {
        padding: 0.35rem 0.7rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .mode-button[aria-pressed='true'] {
        border-color: var(--accent);
        background: #1a2334;
      }
      .mode-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .mode-button:focus-visible,
      .toolbar-toggle input:focus-visible,
      .opponent-select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* The blurb is for the title attribute and the aria-label; repeating it inline would push the
         board off a 1280px window. */
      .mode-blurb {
        display: none;
      }
      .toolbar-field,
      .toolbar-toggle {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        /* A flex item is sized by its content by default, so a wide child makes the row wider than
           the screen no matter what the child is capped at. */
        max-width: 100%;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .opponent-select {
        /* `18rem` alone overflowed a 320px screen: the select was 288px and its inline label took
           the field to 353px, so the page could be scrolled sideways. `min-width: 0` lets the
           control shrink below the intrinsic width of its longest option, which is the only way a
           flex child gets smaller than the text inside it. MOBILE.md stage M1. */
        flex: 1 1 auto;
        min-width: 0;
        max-width: 18rem;
        padding: 0.25rem 0.4rem;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
        font-size: 0.8rem;
      }
      .toolbar-toggles {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .mode-note {
        margin: 0;
        max-width: 44rem;
        color: var(--muted);
        font-size: 0.78rem;
        text-align: center;
      }
      .rules-list {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }
      .rules-section {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .rules-title {
        color: var(--accent);
        font-weight: 600;
        font-size: 0.95rem;
      }
      .rules-summary {
        margin: 0;
        color: var(--ink);
        font-size: 0.88rem;
      }
      .rules-bullets {
        margin: 0;
        padding-left: 1.1rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .rules-bullet {
        margin: 0.2rem 0;
      }
      .rules-caveat {
        margin: 0.1rem 0 0.3rem;
        padding-left: 0.75rem;
        border-left: 2px solid #e8b04b;
        color: #d8c39a;
        font-size: 0.8rem;
      }
      .rules-actions {
        display: flex;
        gap: 0.5rem;
      }
      .rules-heading {
        margin: 0;
        font-size: 0.95rem;
      }
      /* Visible only to a screen reader: the board is a canvas and needs a text mirror. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        /* `rect()` requires commas. `rect(0 0 0 0)` is an invalid declaration and the whole
           property is dropped, which left the live region relying on `overflow` alone. */
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      /* The settings disclosure (MOBILE.md stage M4).
         On a wide screen the trigger is hidden and the panel is part of the bar, so the markup and
         the layout are the same shape either way — only whether it collapses changes. */
      .settings-host {
        display: contents;
      }
      .menu-trigger {
        position: relative;
        padding: 0.35rem 0.7rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      /* The dot is the half of `toolbar.ts`'s principle that survives: a player who needs a
         preference set can see that it is, without opening anything. */
      .menu-trigger.is-marked::after {
        content: '';
        position: absolute;
        top: 4px;
        right: 4px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .menu-panel {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .menu-note {
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
      }

      /* Narrow screens.
         All of it lives here, after the base rules, because a media query adds no specificity: an
         earlier one loses to a later rule that targets the same thing with the same weight. The
         first attempt sat next to `.hand` and was silently overridden by `.hand-card` eleven lines
         below it, so the five cards kept their 7.5rem minimum, overflowed the 361px tray, and two
         of them were clipped away by `overflow-x: clip` without a scrollbar to explain it. */
      /* The chrome the board cannot spare on a phone.
         Measured at 375x667 with the tray on one row and the settings collapsed, the page was 97px
         too tall. These cost 98px, which is the whole of it: the title is 38 with its gap, the mode
         note 32, and every gap trimmed from 12px to 8px saves 4px across seven of them.

         The title goes because a phone tab already says "Tetra Master" and carries the icon, and a
         letter-spaced heading is the first thing that should yield when the board needs the room.
         The mode note is the mode's own blurb, which is on the mode button's `title` and in its
         accessible name, and is said again in the results at the end of a match. */
      @media (max-width: 48rem) {
        /* The mode bar, the Settings button and their gaps came to 302px inside a 300px column at
           320px wide — two pixels over, which put the toolbar on a second row and cost 56px. The gap
           is the only thing there to give. */
        .toolbar-bar {
          gap: 0.5rem;
        }
        body {
          gap: 0.5rem;
          /* The board's own padding. 16px of body padding is a lot on a screen that is being asked
             to hold a board and a hand tray at once. */
          padding-top: max(0.625rem, env(safe-area-inset-top));
          padding-bottom: max(0.625rem, env(safe-area-inset-bottom));
          padding-left: max(0.625rem, env(safe-area-inset-left));
          padding-right: max(0.625rem, env(safe-area-inset-right));
        }
        h1 {
          display: none;
        }
        .mode-note {
          display: none;
        }
        /* Two full-size buttons for two secondary destinations. They keep their labels and their
           order; they just stop being padded like desktop buttons. */
        .toolbar .rematch {
          padding: 0.3rem 0.55rem;
          font-size: 0.85rem;
        }
      }
      /* The disclosure becomes a panel rather than part of the bar. Whether it collapses at all is
         decided by `main.ts` with `matchMedia`, so that `hidden` and `aria-expanded` agree; this is
         only how the open panel is arranged. */
      @media (max-width: 48rem) {
        .menu-panel {
          flex-direction: column;
          align-items: stretch;
          gap: 0.5rem;
          width: 100%;
          padding: 0.75rem;
          background: var(--panel);
          border: 1px solid var(--edge);
          border-radius: 10px;
        }
        .toolbar-field {
          flex-direction: column;
          align-items: stretch;
          gap: 0.25rem;
        }
        .menu-note {
          margin: 0;
        }
      }
      /* "Master Tournament" is 146px on its own, which is what pushed the mode bar onto a second row
         at 320px. The full name stays in `title` and in the accessible name. */
      @media (max-width: 30rem) {
        /* "Master Tournament" is 146px on its own. Abbreviated to 100px, which is what lets the
           mode bar share a row with the Settings button rather than taking one of its own — worth
           45px of page height at 360px wide. The full name stays in `title` and in the accessible
           name. */
        .mode-button[data-mode='tournament'] {
          font-size: 0;
        }
        .mode-button[data-mode='tournament']::before {
          content: 'Tournament';
          font-size: 0.85rem;
        }
        /* The tray's own padding. A 320px phone was 21px over with 44px touch targets applied, and
           this is where those last 21px come from — the card's padding and the gap between its
           three lines, which on a 57px-wide card are a fifth of its height. */
        .hand-card {
          padding: 0.35rem 0.25rem;
          gap: 0.1rem;
        }
        /* 44px touch targets left the 320px phone 14px over, which clipped the bottom of the tray —
           which is where a home indicator is. This is the last of it: 4px of padding and 2px off
           each of five gaps. At 360px and above none of this applies. */
        body {
          gap: 0.375rem;
          padding-top: max(0.5rem, env(safe-area-inset-top));
          padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
          padding-left: max(0.5rem, env(safe-area-inset-left));
          padding-right: max(0.5rem, env(safe-area-inset-right));
        }
        /* And the Settings button gives up its label for a glyph, for the same reason. `\FE0E`
           forces text presentation so the gear does not arrive as a colour emoji. */
        .menu-trigger {
          padding: 0.35rem 0.5rem;
        }
        .menu-trigger span {
          display: none;
        }
        .menu-trigger::before {
          content: '⚙\FE0E';
          font-size: 1rem;
          line-height: 1;
        }
      }
      @media (max-height: 760px) {
        .mode-note,
        .keys {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>Tetra Master</h1>
    <div class="toolbar-bar" id="toolbar" role="toolbar" aria-label="Mode and settings"></div>
    <div class="collection-panel" id="collection" hidden aria-label="Collection and deck"></div>
    <div class="collection-panel" id="rules" hidden aria-label="How to play"></div>
    <div class="board-slot">
      <canvas id="board" width="560" height="560" aria-label="Game board"></canvas>
    </div>
    <div class="toolbar">
      <button type="button" class="rematch" id="toggle-collection">Collection (C)</button>
      <button type="button" class="rematch" id="toggle-rules">How to play (R)</button>
    </div>
    <p class="mode-note" id="mode-note"></p>
    <p class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="hand" id="hand" role="group" aria-label="Your hand"></div>
    <div class="picker" id="picker" hidden></div>
    <div class="picker" id="results" hidden role="group" aria-label="Match result"></div>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <p class="keys" id="keys"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
