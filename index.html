<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tetra Master</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #12151c;
        --edge: #2a3040;
        --ink: #e6e9f0;
        --muted: #8b93a7;
        --player: #5b8dd6;
        --ai: #d68a5b;
        --accent: #7aa2f7;
      }
      * {
        box-sizing: border-box;
      }
      html {
        /* Belt and braces. M1 removed the last element that overflowed sideways, but a document
           that can be dragged horizontally is the kind of thing that comes back. `clip` rather than
           `hidden`, so it cannot become a scroll container of its own. */
        overflow-x: clip;
      }
      body {
        margin: 0;
        /* 100vh is the *large* viewport: on a phone it runs under a URL bar that then collapses
           over the content. `dvh` is what is actually on screen. Declared second so the fallback
           wins where it is unsupported. */
        /* Constrained, not `min-height`. A minimum lets the body grow to its content, and then the
           board slot has no overflow to distribute and the board never shrinks — which is what
           actually happened the first time round. `overflow-y: auto` is the safety valve for the
           case where even this is not enough: the collection screen, or a text size that makes the
           controls genuinely taller than a phone. */
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        /* A notch on the left or right, and a home indicator at the bottom, both sit *inside* the
           viewport once `viewport-fit=cover` is set, so the padding has to make room for them. */
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      /* The board's size belongs to CSS, not to JavaScript. `main.ts` reads the result and works
         out the backing store and the transform; it does not decide how big the board is.
         No `width` or `height` here on purpose: with both left `auto`, the `max-*` constraints clamp
         the element's intrinsic size and the square survives. Setting either one would let the box
         go rectangular, because each `max-*` would then clamp independently. */
      canvas {
        display: block;
        width: auto;
        height: auto;
        max-width: min(100%, 560px);
        max-height: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgb(0 0 0 / 55%);
        touch-action: none;
      }
      /* The space the board is allowed to occupy: whatever the column above and below it did not
         need. `min-height: 0` is the part that matters — without it a flex item refuses to shrink
         below its content, and the board would push the hand tray off the screen instead of
         giving way to it. */
      .board-slot {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: grid;
        place-items: center;
      }
      .status {
        min-height: 1.4em;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .hand {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 100%;
      }
      /* One row, always. Five cards at `min-width: 7.5rem` wrap to three rows below about 640px, and
         measured on a 390x844 phone the tray came out **444px tall** — 46% of everything on the
         page that was not the board. No viewport work fixes a tray that wraps; the tray has to stop
         wrapping. Below 40rem the five cards share the row instead, which keeps all of them on
         screen at once: scrolling a tray to see which card you are holding is worse than a small
         one. MOBILE.md stage M2. */
      @media (max-width: 40rem) {
        .hand {
          flex-wrap: nowrap;
        }
        .hand-card {
          min-width: 0;
          flex: 1 1 0;
          align-items: center;
          text-align: center;
        }
      }
      .hand-card,
      .picker-option,
      .claim-card,
      .rematch {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.5rem 0.7rem;
        min-width: 7.5rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .hand-card:hover,
      .picker-option:hover,
      .claim-card:hover,
      .rematch:hover {
        border-color: var(--accent);
      }
      .hand-card:focus-visible,
      .picker-option:focus-visible,
      .claim-card:focus-visible,
      .rematch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hand-card.is-selected {
        border-color: var(--accent);
        background: #1a2334;
      }
      /* The card's arrow pattern, drawn with the same code the board uses. */
      .arrow-preview {
        display: block;
        margin: 0 auto;
        border-radius: 6px;
        border: 1px solid var(--edge);
      }
      .hand-name {
        font-weight: 600;
      }
      .hand-code,
      .picker-codes {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hand-arrows {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .hand-arrows.is-dead,
      .hand-warning {
        color: #e88b8b;
        font-size: 0.75rem;
      }
      .picker {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.75rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        max-width: 40rem;
      }
      .picker-heading,
      .result-heading {
        margin: 0;
        font-size: 0.95rem;
      }
      .picker-list,
      .claim-list {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .picker-odds {
        color: var(--accent);
        font-size: 0.85rem;
      }
      .picker-arrows {
        color: var(--muted);
        font-size: 0.75rem;
      }
      .result-body,
      .result-taken {
        margin: 0.25rem 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .hint {
        min-height: 1.4em;
        color: var(--accent);
        font-size: 0.85rem;
        max-width: 40rem;
        text-align: center;
      }
      .keys {
        color: #5a6274;
        font-size: 0.75rem;
        text-align: center;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .collection-panel {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(64rem, 96vw);
        padding: 1rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
      }
      .collector-level {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--accent);
      }
      /* §1.9: the original superimposes this once the catalogue is complete. Reproduced, not fixed. */
      .collector-level.is-glitch {
        color: #e8b04b;
        letter-spacing: 0.08em;
      }
      .collector-points,
      .collector-progress,
      .deck-heading,
      .deck-name,
      .deck-code,
      .deck-empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .deck-name {
        color: var(--ink);
        font-weight: 600;
      }
      .collection-controls,
      .deck-actions,
      .deck-slots {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .collection-filter {
        display: flex;
        gap: 0.3rem;
        align-items: center;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .collection-search,
      .collection-filter select {
        padding: 0.25rem 0.4rem;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
      }
      .collection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: 0.5rem;
        max-height: 45vh;
        overflow-y: auto;
      }
      .collection-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        text-align: center;
        padding: 0.5rem 0.7rem;
        background: #161a24;
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .collection-card:hover {
        border-color: var(--accent);
      }
      .collection-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .collection-card.is-decked {
        border-color: var(--accent);
        background: #1a2334;
      }
      .collection-name {
        font-weight: 600;
        padding-right: 2.5rem;
      }
      .collection-meta {
        font-family: inherit;
      }
      .collection-code,
      .collection-meta {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .collection-points-badge {
        position: absolute;
        top: 0.5rem;
        right: 0.6rem;
        color: var(--accent);
        font-weight: 600;
        font-size: 0.85rem;
      }
      .collection-points-badge.is-zero {
        color: #5a6274;
      }
      .collection-empty {
        color: var(--muted);
        text-align: center;
      }
      .deck-slots {
        align-items: stretch;
      }
      .deck-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        text-align: center;
        flex: 1 1 12rem;
        padding: 0.5rem 0.7rem;
        background: #161a24;
        border: 1px solid var(--edge);
        border-radius: 8px;
      }
      .deck-clear {
        align-self: center;
        padding: 0.2rem 0.5rem;
        background: none;
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--muted);
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .deck-clear:hover {
        border-color: var(--accent);
        color: var(--ink);
      }
      .deck-warning {
        margin: 0;
        color: #e88b8b;
        font-size: 0.75rem;
      }
      .toolbar-bar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        width: min(64rem, 96vw);
      }
      .mode-bar {
        display: flex;
        gap: 0.25rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .mode-button {
        padding: 0.35rem 0.7rem;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .mode-button[aria-pressed='true'] {
        border-color: var(--accent);
        background: #1a2334;
      }
      .mode-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .mode-button:focus-visible,
      .toolbar-toggle input:focus-visible,
      .opponent-select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* The blurb is for the title attribute and the aria-label; repeating it inline would push the
         board off a 1280px window. */
      .mode-blurb {
        display: none;
      }
      .toolbar-field,
      .toolbar-toggle {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        /* A flex item is sized by its content by default, so a wide child makes the row wider than
           the screen no matter what the child is capped at. */
        max-width: 100%;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .opponent-select {
        /* `18rem` alone overflowed a 320px screen: the select was 288px and its inline label took
           the field to 353px, so the page could be scrolled sideways. `min-width: 0` lets the
           control shrink below the intrinsic width of its longest option, which is the only way a
           flex child gets smaller than the text inside it. MOBILE.md stage M1. */
        flex: 1 1 auto;
        min-width: 0;
        max-width: 18rem;
        padding: 0.25rem 0.4rem;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
        font-size: 0.8rem;
      }
      .toolbar-toggles {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .mode-note {
        margin: 0;
        max-width: 44rem;
        color: var(--muted);
        font-size: 0.78rem;
        text-align: center;
      }
      .rules-list {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }
      .rules-section {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .rules-title {
        color: var(--accent);
        font-weight: 600;
        font-size: 0.95rem;
      }
      .rules-summary {
        margin: 0;
        color: var(--ink);
        font-size: 0.88rem;
      }
      .rules-bullets {
        margin: 0;
        padding-left: 1.1rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .rules-bullet {
        margin: 0.2rem 0;
      }
      .rules-caveat {
        margin: 0.1rem 0 0.3rem;
        padding-left: 0.75rem;
        border-left: 2px solid #e8b04b;
        color: #d8c39a;
        font-size: 0.8rem;
      }
      .rules-actions {
        display: flex;
        gap: 0.5rem;
      }
      .rules-heading {
        margin: 0;
        font-size: 0.95rem;
      }
      /* Visible only to a screen reader: the board is a canvas and needs a text mirror. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        /* `rect()` requires commas. `rect(0 0 0 0)` is an invalid declaration and the whole
           property is dropped, which left the live region relying on `overflow` alone. */
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-height: 760px) {
        .mode-note,
        .keys {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>Tetra Master</h1>
    <div class="toolbar-bar" id="toolbar" role="toolbar" aria-label="Mode and settings"></div>
    <div class="collection-panel" id="collection" hidden aria-label="Collection and deck"></div>
    <div class="collection-panel" id="rules" hidden aria-label="How to play"></div>
    <div class="board-slot">
      <canvas id="board" width="560" height="560" aria-label="Game board"></canvas>
    </div>
    <div class="toolbar">
      <button type="button" class="rematch" id="toggle-collection">Collection (C)</button>
      <button type="button" class="rematch" id="toggle-rules">How to play (R)</button>
    </div>
    <p class="mode-note" id="mode-note"></p>
    <p class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="hand" id="hand" role="group" aria-label="Your hand"></div>
    <div class="picker" id="picker" hidden></div>
    <div class="picker" id="results" hidden role="group" aria-label="Match result"></div>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <p class="keys" id="keys"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
