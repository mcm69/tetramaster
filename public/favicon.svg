<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tetra Master">
  <!--
    A card face: the game's own frame colour, and the diamond it is named for. Drawn as vector so it
    is sharp at every size the browser asks for, and so the repo keeps its no-dependency rule — a
    raster icon would have to be generated and committed as an opaque blob.
  -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#202634" stroke="#5b8dd6" stroke-width="2" />
  <path d="M16 7 L25 16 L16 25 L7 16 Z" fill="#7aa2f7" />
  <path d="M16 12.5 L19.5 16 L16 19.5 L12.5 16 Z" fill="#e6e9f0" />
</svg>